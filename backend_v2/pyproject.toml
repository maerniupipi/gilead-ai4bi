[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xiaoying-quick-backend"
version = "0.1.0"
description = "Modular Quick backend for Xiaoying"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.14",
  "cryptography>=44.0",
  "eval-type-backport>=0.2.2",
  "fastapi>=0.118.0,<0.129.0",
  "httpx>=0.28",
  "Jinja2>=3.1.6,<4",
  "tokenizers==0.22.2",
  "markdown-it-py>=3.0,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20",
  "python-pptx>=1.0.2,<2",
  "reportlab>=4.4,<5",
  "openpyxl>=3.1.5,<4",
  "PyMySQL>=1.1",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0.36",
  "sqlglot>=25.0",
  "starlette>=0.45.0,<0.50.0",
  "uvicorn[standard]>=0.32.0,<0.36.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pypdf>=5,<7",
  "ruff>=0.9",
  "tomli>=2.0.1; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xiaoying_quick"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt copy is a single artifact read by a model, not by a compiler. Wrapping
# a Chinese sentence to satisfy a column limit changes what the model sees.
"src/xiaoying_quick/infrastructure/llm/prompts.py" = ["E501"]
# SQLAlchemy 2 on Python 3.9 cannot evaluate Mapped[str | None].
"src/xiaoying_quick/infrastructure/persistence/models/*.py" = ["UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
packages = ["xiaoying_quick"]
