name: gilead

x-service: &service
  network_mode: ${GILEAD_NETWORK_MODE:-host}
  restart: ${GILEAD_RESTART:-unless-stopped}
  pull_policy: never
  init: true
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

x-build: &build
  context: ./context
  dockerfile: ../Dockerfile
  network: host

x-health: &health
  interval: 10s
  timeout: 5s
  start_period: 25s
  retries: 6

services:
  postgres:
    <<: *service
    image: gilead/postgres:${RELEASE_TAG:-20261121-m1}
    build: {<<: *build, target: postgres}
    group_add: ["121"]
    shm_size: 256m
    stop_signal: SIGINT
    stop_grace_period: 90s
    volumes:
      - ${PGDATA_HOST:-/var/lib/postgresql/16/main}:/var/lib/postgresql/16/main
      - /etc/postgresql/16/main:/etc/postgresql/16/main:ro
      - ${PG_SOCKET_HOST:-/run/postgresql}:/run/postgresql
      - /etc/ssl/certs/ssl-cert-snakeoil.pem:/etc/ssl/certs/ssl-cert-snakeoil.pem:ro
      - /etc/ssl/private/ssl-cert-snakeoil.key:/etc/ssl/private/ssl-cert-snakeoil.key:ro
    healthcheck:
      <<: *health
      test: ["CMD", "pg_isready", "-h", "/run/postgresql", "-U", "postgres", "-d", "postgres"]

  redis:
    <<: *service
    image: gilead/redis:${RELEASE_TAG:-20261121-m1}
    build: {<<: *build, target: redis}
    stop_grace_period: 45s
    volumes:
      - /etc/redis:/etc/redis:ro
      - ${REDIS_DATA_HOST:-/var/lib/redis}:/var/lib/redis
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /etc/redis/redis.conf | tail -1)\" redis-cli --raw ping | grep -qx PONG"]

  opensearch:
    <<: *service
    image: gilead/opensearch:${RELEASE_TAG:-20261121-m1}
    build: {<<: *build, target: opensearch}
    stop_grace_period: 90s
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ${SEARCH_CONFIG_HOST:-/opt/gilead-ai4bi/opensearch-3.10.0/config}:/opt/gilead-ai4bi/opensearch-3.10.0/config
      - ${STATE_HOST:-/var/lib/gilead-ai4bi}/search:/var/lib/gilead-ai4bi/search
      - ${SEARCH_LOG_HOST:-/var/log/gilead-search}:/var/log/gilead-search
      - ${SEARCH_GC_LOG_HOST:-/opt/gilead-ai4bi/opensearch-3.10.0/logs}:/opt/gilead-ai4bi/opensearch-3.10.0/logs
    healthcheck:
      <<: *health
      start_period: 75s
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s"]

  s3:
    <<: *service
    image: gilead/s3:${RELEASE_TAG:-20261121-m1}
    build: {<<: *build, target: s3}
    depends_on:
      postgres: {condition: service_healthy}
    stop_grace_period: 60s
    command: ["server", "-dir=/var/lib/gilead-ai4bi/objects", "-ip=127.0.0.1", "-ip.bind=127.0.0.1", "-volume.port=8380", "-volume.max=20", "-master.volumeSizeLimitMB=1024", "-filer", "-s3", "-s3.port=8333", "-s3.config=/etc/gilead-s3/s3.json", "-s3.externalUrl=http://10.3.97.198:9000"]
    volumes:
      - /etc/gilead-s3:/etc/gilead-s3:ro
      - ${STATE_HOST:-/var/lib/gilead-ai4bi}/objects:/var/lib/gilead-ai4bi/objects
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS --max-time 2 http://127.0.0.1:9333/cluster/status >/dev/null && test \"$$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8333/)\" = 403"]

  application:
    <<: *service
    image: gilead/application:${APPLICATION_RELEASE_TAG:-${RELEASE_TAG:-20261121-m1}}
    build: {<<: *build, target: application}
    env_file:
      - {path: /etc/gilead-ai4bi/compose/application.env, format: raw}
    depends_on:
      postgres: {condition: service_healthy}
    stop_grace_period: 60s
    volumes:
      - ${STATE_HOST:-/var/lib/gilead-ai4bi}/application:/var/lib/gilead-ai4bi/application
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:9999/api/v2/health/ready"]

  platform:
    <<: *service
    image: gilead/platform:${PLATFORM_RELEASE_TAG:-${RELEASE_TAG:-20261121-m1}}
    build: {<<: *build, target: platform}
    env_file:
      - {path: /etc/gilead-ai4bi/compose/platform.env, format: raw}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 75s
    volumes:
      - ${STATE_HOST:-/var/lib/gilead-ai4bi}/platform:/var/lib/gilead-ai4bi/platform
      - ${PLATFORM_LOG_HOST:-/var/log/gilead-platform}:/var/log/gilead-platform
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8000/health"]

  nginx:
    <<: *service
    image: gilead/nginx:${NGINX_RELEASE_TAG:-${RELEASE_TAG:-20261121-m1}}
    build: {<<: *build, target: nginx}
    depends_on:
      application: {condition: service_healthy}
      platform: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      s3: {condition: service_healthy}
    stop_signal: SIGQUIT
    stop_grace_period: 75s
    volumes:
      - /etc/nginx:/etc/nginx:ro
      - ${NGINX_LOG_HOST:-/var/log/nginx}:/var/log/nginx
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS --max-time 2 http://127.0.0.1/api/v2/health/live >/dev/null && curl -fsS --max-time 2 http://127.0.0.1:8080/health >/dev/null"]
